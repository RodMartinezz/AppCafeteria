<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Cocina - UMG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #212529; color: white; }
        .card-pedido { background-color: #2c3034; border-left: 8px solid; }
        .estado-encola { border-left-color: #dc3545; } /* Rojo */
        .estado-preparando { border-left-color: #ffc107; } /* Amarillo */
        .estado-listo { border-left-color: #198754; } /* Verde */
    </style>
</head>
<body>

    <div class="container mt-4">
        <h2 class="text-warning fw-bold mb-4">👨‍🍳 Pedidos Activos en Cocina</h2>
        
        <div id="contenedor-pedidos" class="row g-3">
            <div class="col-12 text-center text-muted mt-5">
                <div class="spinner-border text-light mb-2"></div>
                <p>Buscando pedidos en el servidor...</p>
            </div>
        </div>
    </div>

    <script>
        // La dirección de tu servidor Python local
        const API_URL = "http://192.168.100.182:8000";

        async function cargarPedidos() {
            try {
                // Hacemos una petición GET a la ruta que agregamos en Python
                const respuesta = await fetch(`${API_URL}/pedidos_activos`);
                const data = await respuesta.json();
                
                const contenedor = document.getElementById("contenedor-pedidos");
                contenedor.innerHTML = ""; // Limpiar pantalla

                if (data.pedidos.length === 0) {
                    contenedor.innerHTML = "<h4 class='text-center text-muted col-12 mt-5'>No hay pedidos pendientes 😴</h4>";
                    return;
                }

                // Recorremos cada pedido que nos manda MySQL
                data.pedidos.forEach(p => {
                    // Preparamos la lista de platillos
                    let itemsHtml = "";
                    p.items.forEach(item => {
                        let nota = item.notas ? `<small class="text-info d-block">Nota: ${item.notas}</small>` : "";
                        itemsHtml += `<li><b>${item.cantidad}x</b> ${item.nombre} ${nota}</li>`;
                    });

                    // Lógica visual del botón y colores según el estado en la BD
                    let claseColor = "estado-encola";
                    let botonHtml = `<button class="btn btn-warning w-100 fw-bold mt-3" onclick="cambiarEstado(${p.id_pedido}, 'Preparando')">🔥 Empezar a Preparar</button>`;

                    if (p.estado === "Preparando") {
                        claseColor = "estado-preparando";
                        botonHtml = `<button class="btn btn-success w-100 fw-bold mt-3" onclick="cambiarEstado(${p.id_pedido}, 'Listo')">✅ Marcar como Listo</button>`;
                    } else if (p.estado === "Listo") {
                        claseColor = "estado-listo";
                        botonHtml = `<button class="btn btn-secondary w-100 fw-bold mt-3" onclick="cambiarEstado(${p.id_pedido}, 'Entregado')">📦 Entregar al Alumno</button>`;
                    }

                    // Formatear la fecha
                    let hora = new Date(p.fecha_hora).toLocaleTimeString();

                    const card = `
                        <div class="col-12 col-md-6 col-lg-4">
                            <div class="card text-white card-pedido ${claseColor} shadow">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <h5 class="card-title text-warning m-0">#${p.id_pedido} - ${p.nombre_estudiante}</h5>
                                        <span class="badge bg-light text-dark">${hora}</span>
                                    </div>
                                    <h6 class="text-muted">Matrícula: ${p.matricula}</h6>
                                    <hr class="border-secondary">
                                    <ul class="fs-5 ps-3">
                                        ${itemsHtml}
                                    </ul>
                                    ${botonHtml}
                                </div>
                            </div>
                        </div>
                    `;
                    contenedor.innerHTML += card;
                });
            } catch (error) {
                console.error("Error conectando con el servidor:", error);
            }
        }

        // Función para actualizar el estado haciendo un PUT al servidor
        async function cambiarEstado(id_pedido, nuevoEstado) {
            try {
                await fetch(`${API_URL}/pedido/${id_pedido}/estado`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ nuevo_estado: nuevoEstado })
                });
                cargarPedidos(); // Recargar la lista inmediatamente
            } catch (error) {
                alert("Error al actualizar el estado");
            }
        }

        // Consultar a la base de datos automáticamente cada 3 segundos
        setInterval(cargarPedidos, 3000);
        cargarPedidos(); // Cargar la primera vez al abrir la página

    </script>
</body>
</html>
