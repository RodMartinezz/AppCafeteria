<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Cocina - UMG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #212529; color: white; }
        .card-pedido { background-color: #2c3034; border-left: 8px solid; }
        .estado-encola { border-left-color: #dc3545; } /* Rojo */
        .estado-preparando { border-left-color: #ffc107; } /* Amarillo */
        .estado-listo { border-left-color: #198754; } /* Verde */
    </style>
</head>
<body>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-warning fw-bold m-0">👨‍🍳 Pedidos Activos en Cocina</h2>
            <span id="indicador" class="badge bg-secondary">Conectando…</span>
        </div>

        <div id="contenedor-pedidos" class="row g-3">
            <div class="col-12 text-center text-muted mt-5">
                <div class="spinner-border text-light mb-2"></div>
                <p>Buscando pedidos en el servidor...</p>
            </div>
        </div>
    </div>

    <script>
        // Abierto desde http://<IP>:8000/admin  -> usa el mismo servidor (sin IP fija).
        // Abierto como archivo (file://)        -> usa la IP de abajo.
        const API_URL = location.protocol.startsWith("http")
            ? location.origin
            : "http://192.168.100.182:8000";
        const WS_URL = API_URL.replace(/^http/, "ws");

        // El nombre y las notas los escribe el alumno: se escapan para evitar inyección de HTML
        function esc(texto) {
            const d = document.createElement("div");
            d.textContent = texto ?? "";
            return d.innerHTML;
        }

        function pintarIndicador(enVivo) {
            const el = document.getElementById("indicador");
            el.className = "badge " + (enVivo ? "bg-success" : "bg-warning text-dark");
            el.textContent = enVivo ? "🟢 En vivo" : "🟠 Reconectando… (actualizando cada 5 s)";
        }

        async function cargarPedidos() {
            try {
                const respuesta = await fetch(`${API_URL}/pedidos_activos`);
                if (!respuesta.ok) throw new Error("HTTP " + respuesta.status);
                const data = await respuesta.json();

                const contenedor = document.getElementById("contenedor-pedidos");

                if (data.pedidos.length === 0) {
                    contenedor.innerHTML = "<h4 class='text-center text-muted col-12 mt-5'>No hay pedidos pendientes 😴</h4>";
                    return;
                }

                contenedor.innerHTML = data.pedidos.map(p => {
                    const itemsHtml = p.items.map(item => {
                        const nota = item.notas ? `<small class="text-info d-block">Nota: ${esc(item.notas)}</small>` : "";
                        return `<li><b>${item.cantidad}x</b> ${esc(item.nombre)} ${nota}</li>`;
                    }).join("");

                    // Color y botón según el estado en la BD
                    let claseColor = "estado-encola";
                    let boton = `<button class="btn btn-warning w-100 fw-bold mt-3" onclick="cambiarEstado(this, ${p.id_pedido}, 'Preparando')">🔥 Empezar a Preparar</button>`;

                    if (p.estado === "Preparando") {
                        claseColor = "estado-preparando";
                        boton = `<button class="btn btn-success w-100 fw-bold mt-3" onclick="cambiarEstado(this, ${p.id_pedido}, 'Listo')">✅ Marcar como Listo</button>`;
                    } else if (p.estado === "Listo") {
                        claseColor = "estado-listo";
                        boton = `<button class="btn btn-secondary w-100 fw-bold mt-3" onclick="cambiarEstado(this, ${p.id_pedido}, 'Entregado')">📦 Entregar al Alumno</button>`;
                    }

                    const hora = new Date(p.fecha_hora).toLocaleTimeString();

                    return `
                        <div class="col-12 col-md-6 col-lg-4">
                            <div class="card text-white card-pedido ${claseColor} shadow">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <h5 class="card-title text-warning m-0">#${p.id_pedido} - ${esc(p.nombre_estudiante)}</h5>
                                        <span class="badge bg-light text-dark">${hora}</span>
                                    </div>
                                    <h6 class="text-muted">Matrícula: ${esc(p.matricula)}</h6>
                                    <hr class="border-secondary">
                                    <ul class="fs-5 ps-3">${itemsHtml}</ul>
                                    ${boton}
                                </div>
                            </div>
                        </div>`;
                }).join("");
            } catch (error) {
                console.error("Error conectando con el servidor:", error);
            }
        }

        // PUT al servidor; el servidor avisa por WebSocket al celular del alumno
        async function cambiarEstado(boton, id_pedido, nuevoEstado) {
            boton.disabled = true; // evita doble clic
            try {
                const res = await fetch(`${API_URL}/pedido/${id_pedido}/estado`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ nuevo_estado: nuevoEstado })
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    alert("No se pudo actualizar: " + (typeof err.detail === "string" ? err.detail : res.status));
                }
            } catch (error) {
                alert("Error de red al actualizar el estado");
            }
            cargarPedidos();
        }

        // --- Tiempo real: el servidor avisa cuando hay algo nuevo ---
        let ws = null;
        let reintento = 0;

        function conectarWS() {
            ws = new WebSocket(`${WS_URL}/ws/cocina`);
            ws.onopen = () => { reintento = 0; pintarIndicador(true); cargarPedidos(); };
            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                if (msg.tipo === "actualizar") cargarPedidos();
            };
            ws.onclose = () => {
                pintarIndicador(false);
                reintento = Math.min(reintento + 1, 5);
                setTimeout(conectarWS, reintento * 1000);
            };
            ws.onerror = () => ws.close();
        }

        // Respaldo: si el WebSocket está caído, consulta cada 5 segundos
        setInterval(() => {
            if (!ws || ws.readyState !== WebSocket.OPEN) cargarPedidos();
        }, 5000);

        cargarPedidos();
        conectarWS();
    </script>
</body>
</html>
